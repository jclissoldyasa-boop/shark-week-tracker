<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shark Week Tracker</title>
<meta name="description" content="Private period and cycle tracker with charts, symptom patterns and phase-by-phase health tips. End-to-end encrypted.">
<meta name="theme-color" content="#FBF6EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1716" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root {
  --bg: #FBF6EF; --surface: #FFFFFF; --surface2: #F7EADF; --line: #EEDDD0;
  --text: #3A2F2D; --muted: #6E615C; --faint: #A39690;
  --accent: #B5302F; --accent-ink: #FFFFFF;
  --period: #D0453F; --period-ink: #FFFFFF; --foll: #7B8794; --fert: #2A9D8F; --lut: #E08A4F;
  --period-wash: rgba(242,139,130,.22); --fert-wash: rgba(42,157,143,.14);
  --warn: #9A5B00; --warn-bg: #FFF1DC; --ok: #2E8A62;
  --glow: linear-gradient(180deg, rgba(248,180,140,.55) 0, rgba(242,139,130,.18) 140px, rgba(251,246,239,0) 300px);
  --shadow: 0 1px 2px rgba(120,60,40,.06), 0 6px 18px rgba(120,60,40,.07);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1E1716; --surface: #2A201E; --surface2: #382B28; --line: #4A3A36;
    --text: #FBF1EA; --muted: #CDB9AE; --faint: #9A877E;
    --accent: #F28B82; --accent-ink: #2A1110;
    --period: #F07A70; --period-ink: #2A1110; --foll: #A3AEB8; --fert: #3DBFAE; --lut: #F8B48C;
    --period-wash: rgba(240,122,112,.22); --fert-wash: rgba(61,191,174,.18);
    --warn: #FFC56B; --warn-bg: #3A2A12; --ok: #6FD3A6;
    --glow: linear-gradient(180deg, rgba(181,48,47,.32) 0, rgba(242,139,130,.08) 140px, rgba(30,23,22,0) 300px);
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1E1716; --surface: #2A201E; --surface2: #382B28; --line: #4A3A36;
  --text: #FBF1EA; --muted: #CDB9AE; --faint: #9A877E;
  --accent: #F28B82; --accent-ink: #2A1110;
  --period: #F07A70; --period-ink: #2A1110; --foll: #A3AEB8; --fert: #3DBFAE; --lut: #F8B48C;
  --period-wash: rgba(240,122,112,.22); --fert-wash: rgba(61,191,174,.18);
  --warn: #FFC56B; --warn-bg: #3A2A12; --ok: #6FD3A6;
  --glow: linear-gradient(180deg, rgba(181,48,47,.32) 0, rgba(242,139,130,.08) 140px, rgba(30,23,22,0) 300px);
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { background: var(--glow) no-repeat, var(--bg); }
body { font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-tap-highlight-color: transparent; min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { line-height: 1.2; margin: 0 0 .5rem; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.15rem; } h3 { font-size: 1rem; }
p { margin: 0 0 .75rem; }
.muted { color: var(--muted); } .small { font-size: .85rem; } .center { text-align: center; }
.hidden { display: none !important; }
.wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); }
.card { background: var(--surface); border-radius: 20px; padding: 16px; margin: 0 0 14px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.row { display: flex; gap: 10px; align-items: center; } .row.wrapok { flex-wrap: wrap; } .grow { flex: 1; min-width: 0; }
.between { justify-content: space-between; }
.btn { border: 0; border-radius: 14px; padding: 12px 16px; font-weight: 600; cursor: pointer; background: var(--surface2); min-height: 44px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.danger { background: transparent; border: 1px solid var(--period); color: var(--period); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .55; cursor: default; }
.link { background: none; border: 0; color: var(--accent); padding: 6px 0; cursor: pointer; font-weight: 600; }
label.field { display: block; margin: 0 0 12px; }
label.field > span { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
input[type=text], input[type=email], input[type=password], input[type=number], input[type=date], input[type=time], select, textarea {
  width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); min-height: 44px;
}
textarea { min-height: 80px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.check { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 10px; font-size: .92rem; }
.check input { width: 20px; height: 20px; margin-top: 2px; flex: none; accent-color: var(--accent); }
.err { color: var(--period); font-size: .9rem; min-height: 1.2em; margin: 4px 0 8px; }
.note { background: var(--surface2); border-radius: 12px; padding: 10px 12px; font-size: .88rem; color: var(--muted); }
.warnbox { background: var(--warn-bg); color: var(--text); border-radius: 12px; padding: 12px; font-size: .92rem; border-left: 4px solid var(--warn); }

/* top bar + nav */
.top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.top .logo { flex: none; }
.top .title { font-weight: 800; font-size: 1.1rem; letter-spacing: .2px; }
.sync { font-size: .78rem; color: var(--faint); margin-left: auto; display: flex; gap: 6px; align-items: center; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); display: inline-block; }
.sync.ok i { background: var(--ok); } .sync.busy i { background: var(--lut); } .sync.off i { background: var(--period); }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 20; }
nav.tabs button { flex: 1; max-width: 128px; background: none; border: 0; padding: 8px 0 10px; color: var(--muted); font-size: .72rem; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; min-height: 56px; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current=page] { color: var(--accent); font-weight: 700; }

/* today */
.ringwrap { position: relative; width: 260px; height: 260px; margin: 4px auto 8px; }
.ringwrap svg { width: 100%; height: 100%; }
.ringmid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 50px; }
.ringmid .big { font-size: 2.6rem; font-weight: 800; line-height: 1; }
.ringmid .phase { font-weight: 700; margin-top: 4px; }
.ringmid .sub { color: var(--muted); font-size: .9rem; margin-top: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 4px; display: inline-block; flex: none; }
.sw.period { background: var(--period); } .sw.foll { background: var(--foll); } .sw.fert { background: var(--fert); } .sw.lut { background: var(--lut); }
.sw.pred { border: 2px dashed var(--period); background: transparent; } .sw.fw { background: var(--fert-wash); border: 1px solid var(--fert); }
.sw.ov { border: 2px solid var(--fert); border-radius: 50%; background: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 8px 13px; cursor: pointer; font-size: .9rem; min-height: 40px; }
.chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip.tag { cursor: default; padding: 4px 10px; min-height: 0; font-size: .82rem; }
.tips li { margin-bottom: 6px; } .tips { padding-left: 20px; margin: 6px 0 0; }
.tiprow { display: grid; grid-template-columns: 26px 1fr; gap: 6px 8px; align-items: start; margin-bottom: 8px; }
.tipdot { width: 10px; height: 10px; border-radius: 50%; margin: 7px 0 0 6px; display: block; }
.ico { width: 22px; height: 22px; color: var(--accent); }
.updbar { background: var(--surface2); border: 1px solid var(--accent); border-radius: 14px; padding: 10px 12px; margin-bottom: 14px; display: flex; gap: 10px; align-items: center; font-size: .92rem; }
.updbar .btn { padding: 8px 14px; min-height: 38px; }
.tiprow b { display: block; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: .95rem; }
.kv .k { color: var(--muted); }

/* calendar */
.calhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.calhead button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface2); cursor: pointer; font-size: 1.2rem; }
.calgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.calgrid .dow { text-align: center; font-size: .75rem; color: var(--faint); padding: 4px 0; }
.day { position: relative; aspect-ratio: 1; border-radius: 12px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: .95rem; padding: 0; }
.day.out { visibility: hidden; }
.day.future { color: var(--muted); }
.day.fw { background: var(--fert-wash); }
.day.period { background: var(--period); color: var(--period-ink); font-weight: 700; }
.day.spot { box-shadow: inset 0 0 0 2px var(--period); }
.day.pred { box-shadow: inset 0 0 0 2px var(--period); border: 0; background-image: repeating-linear-gradient(135deg, var(--period-wash) 0 4px, transparent 4px 8px); }
.day.ov::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; border: 2px solid var(--fert); }
.day.today { outline: 2px solid var(--text); outline-offset: -2px; font-weight: 800; }
.day .dot { position: absolute; bottom: 5px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--muted); }
.day.period .dot { background: var(--period-ink); }
.editbar { background: var(--period); color: var(--period-ink); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; font-size: .9rem; }
.editbar .btn { background: #fff; color: #000; padding: 8px 12px; min-height: 36px; }

/* sheet */
.sheet { position: fixed; inset: 0; background: var(--bg); z-index: 40; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.sheet .wrap { padding-bottom: 40px; }
.sheethead { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; align-items: center; gap: 8px; padding: 10px 0; margin-bottom: 6px; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface2); cursor: pointer; font-size: 1.15rem; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.sec { margin-bottom: 18px; } .sec > h3 { margin-bottom: 8px; }
.scale { display: flex; gap: 6px; } .scale .chip { flex: 1; text-align: center; padding: 8px 0; }
.saved { font-size: .8rem; color: var(--ok); min-width: 54px; text-align: right; }
input[type=range] { width: 100%; accent-color: var(--accent); }

/* charts */
.chart { width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-size: 10.5px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .avg { stroke: var(--text); stroke-width: 1.5; stroke-dasharray: 5 4; }
.chart .band { fill: var(--fert-wash); }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); }
.stat .l { font-size: .8rem; color: var(--muted); } .stat .v { font-size: 1.6rem; font-weight: 700; } .stat .d { font-size: .8rem; color: var(--muted); }
.seg { display: inline-flex; background: var(--surface2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: .85rem; min-height: 34px; }
.seg button[aria-pressed=true] { background: var(--surface); font-weight: 700; box-shadow: var(--shadow); }
table.data { width: 100%; border-collapse: collapse; font-size: .85rem; margin-top: 8px; }
table.data th, table.data td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
table.data th { color: var(--muted); font-weight: 600; }
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--text); color: var(--bg); padding: 6px 9px; border-radius: 8px; font-size: .8rem; max-width: 240px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.hm rect.cell { rx: 3px; }
.pattern { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .93rem; }
.pattern:last-child { border-bottom: 0; }

/* auth */
.auth { max-width: 440px; margin: 0 auto; padding: 32px 16px 40px; }
.brand { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 10px 0 24px; text-align: center; }
.brand .logo { width: 112px; height: auto; filter: drop-shadow(0 6px 14px rgba(181,48,47,.18)); }
.brand .name { font-size: 1.7rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; line-height: 1.1; }
.brand .tag { color: var(--accent); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: .85rem; margin-top: -4px; }
.code { font: 600 1.15rem ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1px; background: var(--surface2); border-radius: 12px; padding: 14px; text-align: center; word-break: break-all; user-select: all; }
.spinner { width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.9s linear infinite; display: inline-block; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
.toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 70; font-size: .9rem; max-width: calc(100% - 32px); }
.list > div { padding: 10px 0; border-bottom: 1px solid var(--line); }
.list > div:last-child { border-bottom: 0; }

/* print (doctor summary) */
@media print {
  body * { visibility: hidden; }
  #report, #report * { visibility: visible; }
  #report { position: absolute; inset: 0; background: #fff; color: #000; }
  #report .noprint { display: none; }
}
</style>
</head>
<body>
<div id="app" aria-live="polite"><div class="auth center"><span class="spinner"></span></div></div>
<nav class="tabs hidden" id="tabs" aria-label="Main">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Today</button>
  <button data-tab="calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendar</button>
  <button data-tab="insights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/></svg>Insights</button>
  <button data-tab="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg>Health</button>
  <button data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Me</button>
</nav>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-label="Log a day"></div>
<div id="report" class="sheet hidden" role="dialog" aria-modal="true" aria-label="Summary for your doctor"></div>
<div id="tip" class="tip hidden" role="tooltip"></div>
<script>
"use strict";
// ============================================================================================
// Shark Week Tracker. Everything you log is encrypted on this device (AES-256-GCM) before it is
// stored or synced; the server only ever holds ciphertext. See README.md "Encryption".
// ============================================================================================

const APP_VERSION = "1.0.0";
const BUILD = "__BUILD__";       // replaced by build.mjs with a hash of this page; used to spot a newer web version
const PBKDF2_ITER = 600000;          // OWASP 2023 guidance for PBKDF2-HMAC-SHA256
const NATIVE = window.SharkNative || null;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const te = new TextEncoder(), td = new TextDecoder();
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- dates (all local, as YYYY-MM-DD) ----------
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diff = (a, b) => Math.round((Date.UTC(...ymd(a)) - Date.UTC(...ymd(b))) / 864e5); // a - b in days
const ymd = s => { const [y, m, d] = s.split("-").map(Number); return [y, m - 1, d]; };
const today = () => iso(new Date());
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const fmt = (s, opts = { day: "numeric", month: "short" }) => parse(s).toLocaleDateString("en-AU", opts);
const fmtLong = s => fmt(s, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

// ---------- what can be logged ----------
const FLOWS = [["spotting", "Spotting"], ["light", "Light"], ["medium", "Medium"], ["heavy", "Heavy"]];
const SYMPTOMS = [["cramps", "Cramps"], ["headache", "Headache"], ["migraine", "Migraine"], ["bloating", "Bloating"], ["tender", "Tender breasts"],
  ["acne", "Acne"], ["backache", "Back pain"], ["fatigue", "Fatigue"], ["nausea", "Nausea"], ["cravings", "Cravings"], ["insomnia", "Trouble sleeping"],
  ["hotflush", "Hot flushes"], ["dizzy", "Dizziness"], ["constipation", "Constipation"], ["diarrhoea", "Diarrhoea"], ["joint", "Joint pain"],
  ["pelvic", "Pelvic pain"], ["brainfog", "Brain fog"], ["clots", "Clots"], ["flooding", "Flooding / leaking"]];
const MOODS = [["calm", "Calm"], ["happy", "Happy"], ["energetic", "Energetic"], ["focused", "Focused"], ["irritable", "Irritable"],
  ["anxious", "Anxious"], ["sad", "Sad"], ["swings", "Mood swings"], ["sensitive", "Sensitive"], ["low", "Low motivation"]];
const MUCUS = [["dry", "Dry"], ["sticky", "Sticky"], ["creamy", "Creamy"], ["watery", "Watery"], ["eggwhite", "Egg white"]];
const LIBIDO = [["low", "Low"], ["normal", "Normal"], ["high", "High"]];
const EXERCISE = [["none", "None"], ["light", "Light"], ["moderate", "Moderate"], ["intense", "Intense"]];
const MEDS = [["painrelief", "Pain relief"], ["iron", "Iron"], ["magnesium", "Magnesium"], ["vitd", "Vitamin D"], ["omega3", "Omega-3"], ["pill", "Contraceptive pill"]];
const LABEL = Object.fromEntries([...FLOWS, ...SYMPTOMS, ...MOODS, ...MUCUS, ...MEDS]);
const DEFAULT_SETTINGS = { cycleLen: 28, periodLen: 5, luteal: 14, fertile: true, theme: "auto",
  remind: { on: false, before: 2, hour: 9, discreet: true, fertile: false, daily: false }, secure: true,
  sleepAuto: false,
  partner: { on: false, id: "", key: "", name: "", from: "", before: 2, symptoms: true, sentFor: "" } };

// ---------- app state ----------
const S = {
  auth: null,          // {token, email, salt, iter, wrapped}
  keys: null,          // {enc: AES-GCM CryptoKey, id: HMAC CryptoKey} — non-extractable
  days: {},            // "YYYY-MM-DD" -> logged values
  settings: { ...DEFAULT_SETTINGS },
  tab: "today", calMonth: null, calEdit: false, sync: { state: "idle", at: 0 }, insight: { metric: "energy", bbt: 0, tables: {} },
};

// =============================== storage (IndexedDB) =====================================
// Keeps the session, the non-extractable keys and an encrypted copy of every document, so the app
// opens and works offline. Nothing in here is plaintext health data.
const idb = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open("sharkweek", 1);
      r.onupgradeneeded = () => { r.result.createObjectStore("kv"); r.result.createObjectStore("docs", { keyPath: "id" }); };
      r.onsuccess = () => res(this.db = r.result);
      r.onerror = () => rej(r.error);
    });
  },
  async tx(store, mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction(store, mode), s = t.objectStore(store);
      const out = fn(s);
      t.oncomplete = () => res(out && "result" in out ? out.result : out);
      t.onerror = () => rej(t.error);
    });
  },
  get: (k) => idb.tx("kv", "readonly", s => s.get(k)),

// =============================== encryption ==============================================
const subtle = crypto.subtle;
const b64 = u8 => btoa(String.fromCharCode(...u8)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64 = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
const rand = n => crypto.getRandomValues(new Uint8Array(n));
const cat = (a, b) => { const o = new Uint8Array(a.length + b.length); o.set(a); o.set(b, a.length); return o; };

async function pbkdf2(password, salt, iter) {
  const k = await subtle.importKey("raw", te.encode(password.normalize("NFKC")), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: te.encode(salt), iterations: iter }, k, 256));
}
async function hkdf(ikm, info, salt = "") {
  const k = await subtle.importKey("raw", ikm, "HKDF", false, ["deriveBits"]);
  return new Uint8Array(await subtle.deriveBits({ name: "HKDF", hash: "SHA-256", salt: te.encode(salt), info: te.encode(info) }, k, 256));
}
/** Password -> a login key (sent to the server) and a wrapping key (never leaves this device). */
async function passwordKeys(password, salt, iter) {
  const m = await pbkdf2(password, salt, iter);
  return { auth: b64(await hkdf(m, "sharkweek-auth-v1")), wrap: await hkdf(m, "sharkweek-wrap-v1") };
}
/** Recovery code -> the same pair. The code is 125 random bits, so it needs no slow hashing. */
async function recoveryKeys(code, email) {
  const c = te.encode(normCode(code));
  return { auth: b64(await hkdf(c, "sharkweek-rec-auth-v1", email)), wrap: await hkdf(c, "sharkweek-rec-wrap-v1", email) };
}
async function aes(raw, usage) { return subtle.importKey("raw", raw, { name: "AES-GCM" }, false, [usage]); }
async function wrapRaw(wrapKey, raw) {
  const iv = rand(12);
  const ct = new Uint8Array(await subtle.encrypt({ name: "AES-GCM", iv, additionalData: te.encode("sharkweek-key-v1") }, await aes(wrapKey, "encrypt"), raw));
  return b64(cat(iv, ct));
}
async function unwrapRaw(wrapKey, s) {
  const u = unb64(s);
  return new Uint8Array(await subtle.decrypt({ name: "AES-GCM", iv: u.slice(0, 12), additionalData: te.encode("sharkweek-key-v1") }, await aes(wrapKey, "decrypt"), u.slice(12)));
}
/** 64 random bytes: 32 for the AES data key, 32 for the HMAC key that makes opaque document ids. */
async function importDataKeys(raw) {
  const keys = {
    enc: await subtle.importKey("raw", raw.slice(0, 32), { name: "AES-GCM" }, false, ["encrypt", "decrypt"]),
    id: await subtle.importKey("raw", raw.slice(32, 64), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]),
  };
  raw.fill(0);

}
/** Proves to the server that a device holds the data key, without revealing it. */
const keyProofOf = async raw => b64(await hkdf(raw, "sharkweek-keyproof-v1"));
/** A copy of the data key encrypted with a key that never leaves this device (non-extractable, in IndexedDB),
 *  so a signed-in device can set a new password if you forget the old one. */
async function saveDeviceCopy(raw) {
  const k = await subtle.generateKey({ name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
  const iv = rand(12);
  const ct = new Uint8Array(await subtle.encrypt({ name: "AES-GCM", iv }, k, raw));
  await idb.set("device", { key: k, data: b64(cat(iv, ct)) });
}
async function deviceRaw() {
  const d = await idb.get("device"); if (!d) return null;
  const u = unb64(d.data);
  return new Uint8Array(await subtle.decrypt({ name: "AES-GCM", iv: u.slice(0, 12) }, d.key, u.slice(12)));
}
const idCache = new Map();
async function docId(key) {
  if (!idCache.has(key)) idCache.set(key, b64(new Uint8Array(await subtle.sign("HMAC", S.keys.id, te.encode(key)))).slice(0, 22));
  return idCache.get(key);
}
async function encryptDoc(id, obj) {
  let json = JSON.stringify(obj);
  json += " ".repeat((256 - (te.encode(json).length % 256)) % 256); // pad so sizes don't hint at what was logged
  const iv = rand(12);
  const ct = new Uint8Array(await subtle.encrypt({ name: "AES-GCM", iv, additionalData: te.encode(id) }, S.keys.enc, te.encode(json)));
  return b64(cat(iv, ct));
}
async function decryptDoc(id, data) {
  const u = unb64(data);
  const pt = await subtle.decrypt({ name: "AES-GCM", iv: u.slice(0, 12), additionalData: te.encode(id) }, S.keys.enc, u.slice(12));
  return JSON.parse(td.decode(pt));
}
const CODE_ALPHA = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const newRecoveryCode = () => [...rand(25)].map(b => CODE_ALPHA[b % 32]).join("").match(/.{5}/g).join("-");
const normCode = s => String(s || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
const normEmail = s => String(s || "").trim().toLowerCase();

// =============================== API + sync ==============================================
class ApiError extends Error { constructor(status, msg) { super(msg); this.status = status; } }
async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json" };
  if (S.auth && S.auth.token) headers.Authorization = "Bearer " + S.auth.token;
  let r;
  try {
    r = await fetch(path, { method: opts.method || "GET", headers, body: opts.body ? JSON.stringify(opts.body) : undefined, cache: "no-store" });
  } catch { throw new ApiError(0, "You're offline. Your changes are saved on this device and will sync later."); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    if (r.status === 401 && S.auth && !opts.noSignout) { signedOutElsewhere(); }
    throw new ApiError(r.status, j.error || "Something went wrong.");
  }
  return j;
}

/** Saves one logical document ("day:2026-10-02" or "settings"), encrypted, then syncs soon. */
async function saveDoc(key, value) {
  const id = await docId(key);
  const data = await encryptDoc(id, { k: key, v: value, t: Date.now() });
  await idb.putDoc({ id, data, dirty: 1 });
  syncSoon();
}
function applyDoc(d) {
  if (!d || typeof d.k !== "string") return;
  if (d.k === "settings") S.settings = { ...DEFAULT_SETTINGS, ...d.v, remind: { ...DEFAULT_SETTINGS.remind, ...(d.v && d.v.remind) }, partner: { ...DEFAULT_SETTINGS.partner, ...(d.v && d.v.partner) } };
  else if (d.k.startsWith("day:")) {
    const day = d.k.slice(4);
    if (d.v && Object.keys(d.v).length) S.days[day] = d.v; else delete S.days[day];
  }
}
async function loadLocal() {
  S.days = {}; S.settings = { ...DEFAULT_SETTINGS };
  for (const row of await idb.allDocs()) {
    try { applyDoc(await decryptDoc(row.id, row.data)); } catch (e) { console.warn("Couldn't decrypt a stored entry", row.id); }
  }
}

let syncTimer = null, syncing = null;
function syncSoon(ms = 1500) { clearTimeout(syncTimer); syncTimer = setTimeout(sync, ms); }
async function sync() {
  if (!S.auth) return;
  if (syncing) return syncing;
  setSync("busy");
  syncing = (async () => {
    try {
      // push local changes
      const dirty = (await idb.allDocs()).filter(d => d.dirty);
      for (let i = 0; i < dirty.length; i += 200) {
        const batch = dirty.slice(i, i + 200);
        await api("/api/docs", { method: "POST", body: { docs: batch.map(d => ({ id: d.id, data: d.data })) } });
        for (const d of batch) {
          const now = await idb.doc(d.id);
          if (now && now.data === d.data) await idb.putDoc({ id: d.id, data: d.data, dirty: 0 });
        }
      }
      // pull other devices' changes
      let cur = (await idb.get("cursor")) || { since: 0, after: "" }, changed = false;
      for (;;) {
        const r = await api(`/api/docs?since=${cur.since}&after=${encodeURIComponent(cur.after)}`);
        for (const d of r.docs) {
          const local = await idb.doc(d.id);
          if (local && local.dirty) continue; // ours is newer and goes up next time
          if (local && local.data === d.data) continue;
          await idb.putDoc({ id: d.id, data: d.data, dirty: 0 });
          try { applyDoc(await decryptDoc(d.id, d.data)); changed = true; } catch { console.warn("Couldn't decrypt a synced entry", d.id); }
        }
        cur = { since: r.since, after: r.after };
        await idb.set("cursor", cur);
        if (!r.more) break;
      }
      S.sync = { state: "ok", at: Date.now() };
      setSync("ok");
      if (changed) { render(); pushReminders(); }
      uploadForecast();
      if ((await idb.allDocs()).some(d => d.dirty)) syncSoon(3000);
    } catch (e) {
      setSync(e.status === 0 ? "off" : "err", e.message);
    } finally { syncing = null; }
  })();
  return syncing;
}
function setSync(state, msg) {
  S.sync.state = state; S.sync.msg = msg || "";
  const el = $("#syncind"); if (!el) return;
  el.className = "sync " + (state === "ok" ? "ok" : state === "busy" ? "busy" : "off");
  el.lastChild.textContent = state === "ok" ? "Synced" : state === "busy" ? "Syncing…" : state === "off" ? "Offline" : "Sync problem";
  el.title = msg || "";
}

// =============================== cycle engine ============================================
const isBleed = v => v && v.flow && v.flow !== "spotting";
/** Groups logged period days (gaps of up to 2 days allowed) into periods. */
function periods() {
  const ds = Object.keys(S.days).filter(d => isBleed(S.days[d])).sort();
  const out = [];
  for (const d of ds) {
    const last = out[out.length - 1];
    if (last && diff(d, last.end) <= 3) last.end = d; else out.push({ start: d, end: d });
  }
  out.forEach(p => p.len = diff(p.end, p.start) + 1);
  return out;
}
function model(on = today()) {
  const st = S.settings, ps = periods().filter(p => p.start <= on);
  const cycles = [];
  for (let i = 0; i < ps.length - 1; i++) cycles.push({ start: ps[i].start, end: addDays(ps[i + 1].start, -1), len: diff(ps[i + 1].start, ps[i].start), periodLen: ps[i].len });
  const valid = cycles.filter(c => c.len >= 15 && c.len <= 90).slice(-6);
  const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
  const avgCycle = valid.length ? Math.round(mean(valid.map(c => c.len))) : st.cycleLen;
  const recentP = ps.slice(-6).filter(p => p.len <= 15);
  const avgPeriod = recentP.length >= 2 ? Math.round(mean(recentP.map(p => p.len))) : st.periodLen;
  const luteal = Math.min(st.luteal, avgCycle - 5);
  const last = ps[ps.length - 1] || null;
  const m = { cycles, valid, avgCycle, avgPeriod, luteal, last, periods: ps };
  if (!last) return m;
  m.cycleDay = diff(on, last.start) + 1;
  // On your period if today is logged as a bleed day, or it's within your usual length and you logged bleeding in the last 2 days.
  m.inPeriod = diff(on, last.end) <= 0 || (diff(on, last.start) < avgPeriod && diff(on, last.end) <= 2);
  m.nextStart = addDays(last.start, avgCycle);
  m.late = diff(on, m.nextStart);  // >0 means overdue by that many days
  m.ovulation = addDays(m.nextStart, -luteal);
  const bbt = bbtShift(last.start, on);
  if (bbt) { m.ovulation = bbt.ovulation; m.ovConfirmed = true; }
  m.fertileStart = addDays(m.ovulation, -5); m.fertileEnd = addDays(m.ovulation, 1);
  m.phase = phaseOf(m.cycleDay, avgCycle, last.len || avgPeriod, diff(m.ovulation, last.start) + 1, m.late > 0);
  if (m.inPeriod) m.phase = "menstrual";
  const ys = valid.map(c => c.len);
  m.range = ys.length >= 3 ? Math.max(...ys) - Math.min(...ys) : null;
  return m;
}
function phaseOf(day, len, plen, ovDay, late) {
  if (day <= plen) return "menstrual";
  if (late) return "luteal";
  if (day < ovDay - 2) return "follicular";
  if (day <= ovDay + 1) return "ovulatory";
  return "luteal";
}
/** Basal temperature "three over six" rule: three readings above the highest of the previous six, the last ≥0.2 °C above. */
function bbtShift(from, to) {
  const pts = [];
  for (let d = from; d <= to; d = addDays(d, 1)) { const t = S.days[d] && +S.days[d].temp; if (t > 34 && t < 40) pts.push({ d, t }); }
  for (let i = 6; i + 2 < pts.length; i++) {
    const cover = Math.max(...pts.slice(i - 6, i).map(p => p.t));
    if (pts[i].t > cover && pts[i + 1].t > cover && pts[i + 2].t >= cover + 0.2) return { ovulation: addDays(pts[i].d, -1), cover, shift: pts[i].d };
  }

}
/** What each calendar day shows: logged period, predicted period, fertile window, ovulation. */
function dayInfo(m) {
  const info = {};
  const mark = (d, k) => { (info[d] = info[d] || {})[k] = true; };
  const ps = m.periods;
  // past cycles: estimated ovulation and fertile window from the actual length
  for (const c of m.cycles) {
    const ov = addDays(c.end, 1 - m.luteal);
    if (S.settings.fertile) for (let k = -5; k <= 1; k++) mark(addDays(ov, k), "fw");
    mark(ov, "ov");
  }
  if (!m.last) return info;
  // current and the next 12 predicted cycles
  let start = m.late > 0 ? today() : m.nextStart;
  let ov = m.ovulation;
  for (let n = 0; n < 12; n++) {
    if (n > 0 || m.late <= 0) {
      if (S.settings.fertile) for (let k = -5; k <= 1; k++) mark(addDays(ov, k), "fw");
      mark(ov, "ov");
    }
    for (let k = 0; k < m.avgPeriod; k++) mark(addDays(start, k), "pred");
    start = addDays(start, m.avgCycle);
    ov = addDays(start, -m.luteal);
  }
  for (const p of ps) for (let d = p.start; d <= p.end; d = addDays(d, 1)) if (info[d]) delete info[d].fw;
  return info;
}

/** Gentle "worth checking with a GP" flags, based on healthdirect and Jean Hailes guidance. Never a diagnosis. */
function healthFlags(m) {
  const flags = [], t = today();
  const v = m.valid;
  if (v.length >= 3) {
    const avg = v.reduce((a, c) => a + c.len, 0) / v.length;
    if (avg < 21) flags.push(["Short cycles", `Your recent cycles average ${Math.round(avg)} days. Cycles regularly shorter than 21 days are worth mentioning to a GP.`]);
    if (avg > 35) flags.push(["Long cycles", `Your recent cycles average ${Math.round(avg)} days. Cycles regularly longer than 35 days can have causes (like PCOS or thyroid issues) a GP can check.`]);
    if (m.range > 20) flags.push(["Changing cycle length", `Your cycle length has varied by ${m.range} days recently. Big swings are common with stress, travel or perimenopause, but worth raising if new for you.`]);
  }
  const recent = m.periods.slice(-3);
  if (recent.filter(p => p.len > 7).length >= 2) flags.push(["Long periods", "Bleeding for more than 7 days more than once can be a sign of heavy menstrual bleeding. A GP can check iron levels and causes."]);
  const heavyPeriods = recent.filter(p => { let h = 0, flood = false; for (let d = p.start; d <= p.end; d = addDays(d, 1)) { const x = S.days[d] || {}; if (x.flow === "heavy") h++; if ((x.sym || []).includes("flooding") || (x.sym || []).includes("clots")) flood = true; } return h >= 3 || flood; });
  if (heavyPeriods.length >= 2) flags.push(["Heavy bleeding", "Heavy days, flooding or clots in more than one recent period. Heavy bleeding is common and treatable — and can cause low iron."]);
  const painful = recent.filter(p => { for (let d = addDays(p.start, -2); d <= p.end; d = addDays(d, 1)) if ((S.days[d] || {}).pain >= 7) return true; return false; });
  if (painful.length >= 2) flags.push(["Severe period pain", "Pain of 7/10 or more in more than one period. Pain that stops you doing everyday things isn't something to just put up with — it can be a sign of endometriosis or adenomyosis."]);
  const inPeriod = d => m.periods.some(p => d >= addDays(p.start, -2) && d <= addDays(p.end, 2));

  if (between.length >= 3) flags.push(["Bleeding between periods", `You've logged bleeding or spotting outside your period on ${between.length} days in the last 3 months. Bleeding between periods or after sex should be checked by a GP.`]);
  if (m.last && m.cycles.length >= 2 && diff(t, m.last.start) > 90) flags.push(["No period for 3 months", "No period logged for over 90 days. If you're not pregnant, on certain contraception or in menopause, a GP can help find out why."]);

}

function topbar(title) {
  return `<div class="top">${LOGO.replace("<img", '<img width="34" height="35"')}<div class="title">${esc(title)}</div>
    <div id="syncind" class="sync"><i></i><span></span></div></div>`;
}
function render() {
  if (!S.auth) return;
  applyTheme();
  $("#tabs").classList.remove("hidden");
  $$("#tabs button").forEach(b => b.dataset.tab === S.tab ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current"));
  const views = { today: viewToday, calendar: viewCalendar, insights: viewInsights, guide: viewGuide, me: viewMe };
  $("#app").innerHTML = `<main class="wrap">${updateBar()}${views[S.tab]()}</main>`;
  setSync(S.sync.state, S.sync.msg);
  if (S.tab === "me") loadSessions();
}
document.addEventListener("click", e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { S.tab = tab.dataset.tab; S.calEdit = false; render(); scrollTo(0, 0); return; }
  const a = e.target.closest("[data-act]");
  if (a && ACT[a.dataset.act]) { if (a.type !== "checkbox") e.preventDefault(); ACT[a.dataset.act](a, e); }
});
const ACT = {}; // click handlers by data-act name (inline handlers are blocked by the Content-Security-Policy)

// =============================== UI: today ===============================================
function ring(m) {
  const L = Math.max(m.avgCycle, m.cycleDay || 0), cx = 130, cy = 130, r = 108, w = 16;
  const ovDay = m.last ? diff(m.ovulation, m.last.start) + 1 : L - m.luteal;
  const plen = m.last ? (m.inPeriod ? Math.max(m.last.len, m.avgPeriod) : m.last.len) : m.avgPeriod;
  let segs = "";
  for (let d = 1; d <= L; d++) {
    const a0 = (d - 1) / L * 2 * Math.PI - Math.PI / 2 + 0.012, a1 = d / L * 2 * Math.PI - Math.PI / 2 - 0.012;
    let ph = d <= plen ? "menstrual" : d > m.avgCycle ? "luteal" : phaseOf(d, m.avgCycle, plen, ovDay, false);
    if (S.settings.fertile && d >= ovDay - 5 && d <= ovDay + 1 && ph !== "menstrual") ph = "ovulatory";
    const col = { menstrual: "var(--period)", follicular: "var(--foll)", ovulatory: "var(--fert)", luteal: "var(--lut)" }[ph];
    const large = a1 - a0 > Math.PI ? 1 : 0;
    segs += `<path d="M${cx + r * Math.cos(a0)} ${cy + r * Math.sin(a0)} A${r} ${r} 0 ${large} 1 ${cx + r * Math.cos(a1)} ${cy + r * Math.sin(a1)}" stroke="${col}" stroke-width="${w}" fill="none" opacity="${m.cycleDay && d > m.cycleDay ? .45 : 1}"/>`;
  }
  let marker = "";
  if (m.cycleDay) {
    const a = (Math.min(m.cycleDay, L) - .5) / L * 2 * Math.PI - Math.PI / 2;
    marker = `<circle cx="${cx + r * Math.cos(a)}" cy="${cy + r * Math.sin(a)}" r="12" fill="var(--text)" stroke="var(--surface)" stroke-width="3"/>`;
  }
  return `<svg viewBox="0 0 260 260" role="img" aria-label="Cycle ring: day ${m.cycleDay || "unknown"} of about ${m.avgCycle}">${segs}${marker}</svg>`;
}
function headline(m) {
  if (!m.last) return { big: "—", phase: "No period logged yet", sub: "Log your last period to get predictions." };
  const t = today();
  if (m.inPeriod) return { big: `Day ${m.cycleDay}`, phase: "Period", sub: `Period day ${diff(t, m.last.start) + 1}` };
  if (m.late > 0) return { big: `Day ${m.cycleDay}`, phase: PHASES[m.phase].name, sub: `Period ${plural(m.late, "day")} late` };
  if (m.late === 0) return { big: `Day ${m.cycleDay}`, phase: PHASES[m.phase].name, sub: "Period due today" };
  return { big: `Day ${m.cycleDay}`, phase: PHASES[m.phase].name, sub: `Period in ${plural(-m.late, "day")}` };

// A private link (/partner#ID.KEY) shows the partner a playful, informative "Shark Week forecast".

  if (pts.length < 3) return { svg: nav + `<p class="muted">Log your temperature each morning before getting up. After ovulation it rises by about 0.2–0.5 °C and stays up until your period.</p>`, rows: [] };

  for (const d of [1, 7, 14, 21, 28, 35, 42].filter(d => d <= N)) s += `<text x="${x(d)}" y="${H - 8}" text-anchor="middle">${d}</text>`;

  if (during.length) out.push(`${list(b(during))} mostly happen${during.length === 1 ? "s" : ""} during your period.`);

// =============================== reminders (Android app) =================================
function pushReminders() {
  if (!NATIVE || !S.auth) return;
  const r = S.settings.remind, m = model(), out = [], now = Date.now();
  const at = (day, hour) => { const d = parse(day); d.setHours(hour, 0, 0, 0); return d.getTime(); };
  const disc = r.discreet;
  if (m.last && r.on) {
    let start = m.late > 0 ? null : m.nextStart;
    for (let n = 0; n < 6 && start; n++, start = addDays(start, m.avgCycle)) {
      out.push({ at: at(addDays(start, -r.before), r.hour), title: disc ? "Shark Week Tracker" : "Period coming up", text: disc ? "A friendly heads-up from Shark Week 🦈" : `Your period may start in about ${plural(r.before, "day")}.` });
    }
  }
  if (m.last && r.fertile && S.settings.fertile && m.late <= 0) out.push({ at: at(m.fertileStart, r.hour), title: "Shark Week Tracker", text: disc ? "Check in with Shark Week today" : "Your estimated fertile window starts today." });
  const pt = S.settings.partner;
  if (m.last && pt.on && m.late <= 0) {
    const day = addDays(m.nextStart, -pt.before);
    if (day >= today()) out.push({ at: at(day, Math.max(r.hour, 9)), title: "Shark Week Tracker", text: disc ? "Time for a heads-up? Tap to send it." : `Strap in! Tap to give ${pt.name || "your partner"} the Shark Week heads-up 🦈`, act: "partner" });
  }
  if (r.daily) for (let k = 0; k < 30; k++) out.push({ at: at(addDays(today(), k), Math.max(r.hour, 20)), title: "Shark Week Tracker", text: "How are you feeling today? Tap to log." });
  NATIVE.setReminders(JSON.stringify(out.filter(x => x.at > now).sort((a, b) => a.at - b.at).slice(0, 60)));
}

// =============================== update checks ===========================================
// /version.json is published with every release. The Android app compares its own version code
// (newer APK -> download link; Android asks before installing); the web app compares this page's
// build hash (newer deploy -> reload). Checked on start, when the app comes back to the front
// (at most every 6 hours) and from Me -> About.
let lastCheck = 0;
async function checkUpdate(force) {
  if (!force && Date.now() - lastCheck < 6 * 3600e3) return;
  lastCheck = Date.now();
  try {
    const r = await fetch("/version.json", { cache: "no-store" }).then(x => x.ok ? x.json() : null);
    if (!r) return;
    let upd = null;
    if (NATIVE && NATIVE.versionCode && r.android && +r.android.code > +NATIVE.versionCode()) upd = { kind: "apk", name: r.android.name, url: r.android.url, notes: r.android.notes || "" };
    else if (!NATIVE && r.web && BUILD.length === 12 && r.web !== BUILD) upd = { kind: "web" };
    const changed = JSON.stringify(upd) !== JSON.stringify(S.update || null);
    S.update = upd;
    if (changed && S.auth) render();
    if (force) toast(upd ? "An update is available." : "You're on the latest version.");
  } catch { if (force) toast("Couldn't check for updates. Are you offline?"); }
}

  const u = S.update; if (!u) return "";

}

  return "";
}

      const raw = rand(64), salt = b64(rand(16)), k = await passwordKeys(pw, salt, PBKDF2_ITER), wrapped = await wrapRaw(k.wrap, raw);
      const code = newRecoveryCode(), rk = await recoveryKeys(code, email), wrappedRec = await wrapRaw(rk.wrap, raw);
      const r = await api("/api/signup", { method: "POST", body: { email, salt, iter: PBKDF2_ITER, auth: k.auth, wrapped, recAuth: rk.auth, wrappedRec, keyProof: await keyProofOf(raw), acceptTerms: true, healthConsent: true, age16: true } });
      showRecoveryCode($("#app main"), code, async () => { await startSession({ token: r.token, email, salt, iter: PBKDF2_ITER, wrapped }, raw); }, "", email);
    } catch (e) { err.textContent = e.message; busy(btn, false); }
  },
  async forgot(f) {
    const err = $("#a_err"), btn = $("button[type=submit]", f); err.textContent = "";
    const email = normEmail($("#a_email").value), code = $("#a_code").value, pw = $("#a_pw").value;
    if (normCode(code).length !== 25) return err.textContent = "Recovery codes are 25 letters and numbers.";
    const bad = passwordProblem(pw, email); if (bad) return err.textContent = bad;
    busy(btn, true, "Checking…");
    try {
      const rk = await recoveryKeys(code, email);
      const r1 = await api("/api/recover/key", { method: "POST", body: { email, recAuth: rk.auth } });
      const raw = await unwrapRaw(rk.wrap, r1.wrappedRec);
      const salt = b64(rand(16)), k = await passwordKeys(pw, salt, PBKDF2_ITER), wrapped = await wrapRaw(k.wrap, raw);
      const next = newRecoveryCode(), nrk = await recoveryKeys(next, email), wrappedRec = await wrapRaw(nrk.wrap, raw);
      const r = await api("/api/recover/reset", { method: "POST", body: { email, recAuth: rk.auth, salt, iter: PBKDF2_ITER, auth: k.auth, wrapped, next: { recAuth: nrk.auth, wrappedRec } } });
      showRecoveryCode($("#app main"), next, async () => { await startSession({ token: r.token, email, salt, iter: PBKDF2_ITER, wrapped }, raw); }, "Password reset. Here's your NEW recovery code — the old one no longer works.", email);
    } catch (e) { err.textContent = e.message; busy(btn, false); }
  },
};
function showRecoveryCode(el, code, done, lead, email = S.auth && S.auth.email) {
  el.innerHTML = `<div class="card"><h2>Save your recovery code</h2>
    <p>${esc(lead || "If you forget your password, this code is the only way to get your data back. We can't reset it for you — we never see your data.")}</p>
    <div class="code" id="rc">${esc(code)}</div>
    <div class="row" style="margin:10px 0"><button class="btn ghost grow" data-act="copyCode">Copy</button><button class="btn ghost grow" data-act="saveCode">Download</button></div>
    <p class="small muted">Keep it in a password manager or somewhere safe. Don't share it.</p>
    <label class="check"><input type="checkbox" id="rc_ok"><span>I've saved my recovery code.</span></label>
    <button class="btn primary block" data-act="codeDone" disabled id="rc_btn">Continue</button></div>`;
  $("#rc_ok").addEventListener("change", e => { $("#rc_btn").disabled = !e.target.checked; });
  ACT.copyCode = () => navigator.clipboard.writeText(code).then(() => toast("Copied"), () => toast("Select the code and copy it."));
  ACT.saveCode = () => { const t = `Shark Week Tracker recovery code\nAccount: ${email || ""}\n\n${code}\n\nKeep this safe. It unlocks your data if you forget your password.\n`; if (NATIVE) toast(NATIVE.saveFile("shark-week-recovery-code.txt", t, "text/plain") || "Saved to Downloads"); else { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([t], { type: "text/plain" })); a.download = "shark-week-recovery-code.txt"; a.click(); } };
  ACT.codeDone = async b => { busy(b, true); await done(); };
}
async function startSession(authInfo, raw) {
  await idb.wipe();
  const proof = await keyProofOf(raw);
  await saveDeviceCopy(raw);
  S.keys = await importDataKeys(raw);
  S.auth = authInfo;
  await idb.set("auth", authInfo); await idb.set("keys", S.keys);
  idCache.clear();
  api("/api/keyproof", { method: "POST", body: { keyProof: proof } }).catch(() => {}); // for accounts made before device resets existed
  await loadLocal();
  $("#app").innerHTML = `<div class="auth center"><span class="spinner"></span><p class="muted">Fetching and decrypting your data…</p></div>`;
  await sync();
  if (NATIVE) NATIVE.setSecure(S.settings.secure);
  S.tab = "today"; render(); pushReminders();
  checkConsent(); checkUpdate();
}
async function checkConsent() {
  try {
    const me = await api("/api/me");
    if (!me.consentCurrent) {
      modal(`<h2>We've updated our terms</h2><p>Please review the updated <a href="/privacy" target="_blank">Privacy Policy</a> and <a href="/terms" target="_blank">Terms of Use</a>.</p>
        <label class="check"><input type="checkbox" id="cc_ok"><span>I agree, and I consent to my (encrypted) health information being stored as described.</span></label>
        <div class="row"><button class="btn ghost grow" data-act="signOut">Sign out</button><button class="btn primary grow" data-act="consentOk">Continue</button></div>`);
      ACT.consentOk = async () => { if (!$("#cc_ok").checked) return toast("Tick the box to continue, or sign out."); await api("/api/consent", { method: "POST" }); history.back(); };
    }
  } catch {}
}

// =============================== start ===================================================
async function boot() {
  if ("serviceWorker" in navigator && !NATIVE && location.protocol === "https:") navigator.serviceWorker.register("/sw.js").catch(() => {});
  const params = new URLSearchParams(location.search);
  const reset = (location.hash.match(/^#reset=([A-Za-z0-9_-]{43})$/) || [])[1];
  if (reset) return showEmailReset(reset); // this device's own session (if any) is only replaced once the reset succeeds
  try {
    S.auth = await idb.get("auth"); S.keys = await idb.get("keys");
  } catch { S.auth = null; }
  if (!S.auth || !S.keys) { S.auth = null; return showAuth("welcome", params.has("deleted") ? "Your account and data have been deleted." : ""); }
  await loadLocal();
  if (NATIVE) NATIVE.setSecure(S.settings.secure);
  render();
  sync().then(() => { pushReminders(); checkConsent(); checkUpdate(); syncSleep(); uploadForecast(); });
  setInterval(() => document.visibilityState === "visible" && sync(), 5 * 60e3);
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.auth) { sync(); checkUpdate(); if (S.tab === "today") render(); } });
addEventListener("online", () => S.auth && sync());
addEventListener("hashchange", () => { const t = (location.hash.match(/^#reset=([A-Za-z0-9_-]{43})$/) || [])[1]; if (t) showEmailReset(t); });
window.swResume = () => { if (S.auth) { sync(); syncSleep(); } };
boot();
</script>
